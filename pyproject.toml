[project]
name = "celery-redis-experiments"
version = "0.1.0"
description = "Reproducible Celery and Redis worker experiments"
requires-python = "==3.13.9"
# Celery and Kombu are NOT installed: repos.lock.toml pins their Git checkouts.
# This shared environment supplies their runtime dependencies and all suite tools.
dependencies = [
    "amqp==5.4.2",
    "billiard==4.3.2",
    "click==8.5.1",
    "click-didyoumean==0.3.1",
    "click-plugins==1.1.1.2",
    "click-repl==0.4.1",
    "gevent==26.9.0",
    "greenlet==3.5.6",
    "packaging==26.3",
    "prompt-toolkit==3.0.53",
    "python-dateutil==2.9.0.post0",
    "redis==8.1.0",
    "six==1.17.0",
    "typing-extensions==4.16.0",
    "tzlocal==5.4.5",
    "vine==5.1.0",
    "wcwidth==0.9.4",
    "zope-event==6.2",
    "zope-interface==8.7",
]

[tool.uv]
package = false
# mise owns Python; do not prefer a different uv-managed build of the same version.
python-preference = "only-system"
python-downloads = "never"
